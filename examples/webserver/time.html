<!DOCTYPE html>
<html>
<head>
    <title>Time Page - IOk Webserver</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(120deg, #2c3e50, #3498db);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .clock-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            min-width: 350px;
            animation: slideUp 0.8s ease-out;
        }
        .time-display {
            font-size: 4em;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }
        .date-info {
            font-size: 1.3em;
            margin-bottom: 30px;
            opacity: 0.8;
            line-height: 1.4;
        }
        .server-info {
            font-size: 1em;
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            margin-top: 20px;
        }
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        .back-link a {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(78, 205, 196, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .back-link a:hover {
            background: rgba(78, 205, 196, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.3);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <div class="time-display" id="clock">
            00:00:00
        </div>
        
        <div class="date-info">
            <p>⏰ Current Server Time</p>
            <p>This time page demonstrates dynamic content serving with IOk</p>
        </div>
        
        <div class="server-info">
            <p>🌐 IOk Webserver is running</p>
            <p>Serving static HTML files dynamically</p>
        </div>
        
        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
